<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login Area CMS Pengelolaan Portofolio">
  <title>Login CMS - Portfolio Rijal</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">

  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.08) 0%, transparent 70%), var(--bg-page);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: var(--space-xl) var(--space-lg);
      box-shadow: var(--shadow-card);
      backdrop-filter: var(--backdrop-blur);
      -webkit-backdrop-filter: var(--backdrop-blur);
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    .login-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--accent-surface);
      color: var(--accent-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: var(--space-xs);
      border: 1px solid var(--accent-border);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-3xs);
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: var(--space-md);
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: var(--space-2xs);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all var(--transition-fast);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-surface);
    }

    .error-box {
      display: none;
      padding: 0.75rem 1rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-sm);
      color: #fca5a5;
      font-size: 0.85rem;
      margin-bottom: var(--space-md);
      align-items: center;
      gap: var(--space-xs);
    }

    .error-box.show {
      display: flex;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent-gradient);
      color: var(--text-on-accent);
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2xs);
      transition: opacity var(--transition-fast), transform var(--transition-fast);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .login-footer-actions {
      margin-top: var(--space-lg);
      text-align: center;
      border-top: 1px solid var(--border-subtle);
      padding-top: var(--space-md);
    }

    .back-link {
      font-size: 0.875rem;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: var(--space-2xs);
      transition: color var(--transition-fast);
    }

    .back-link:hover {
      color: var(--accent-primary);
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <main class="login-card">
      <header class="login-header">
        <div class="login-icon" aria-hidden="true">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="login-title">CMS Login</h1>
        <p class="login-subtitle">Masuk untuk mengelola konten portofolio</p>
      </header>

      <!-- Pesan Kesalahan Password -->
      <div id="error-message" class="error-box" role="alert" aria-live="polite">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <span id="error-text">Password yang Anda masukkan salah.</span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="password" class="form-label">Password Akses</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-key input-icon" aria-hidden="true"></i>
            <input type="password" id="password" name="password" class="form-input" placeholder="Masukkan password..."
              required autocomplete="current-password" autofocus>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">
          <span>Masuk ke CMS</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
      </form>

      <footer class="login-footer-actions">
        <a href="./index.html" class="back-link">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          <span>Kembali ke Halaman Portfolio</span>
        </a>
      </footer>
    </main>
  </div>

  <script>
    // Sinkronkan tema dari preferensi lokal
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const errorBox = document.getElementById('error-message');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredPassword = passwordInput.value.trim();

      // Logika if else sesuai spesifikasi PRD (password default: 'password')
      if (enteredPassword === 'password') {
        sessionStorage.setItem('portfolio_cms_auth', 'true');
        window.location.href = './cms.html';
      } else {
        errorBox.classList.add('show');
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>

</html>
